{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>{% block title %}Tahir Rafique Clothes House{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSP -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:;">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'logos/logo-.png' %}">
    <link rel="shortcut icon" href="{% static 'logos/logo-.png' %}">
    <link rel="apple-touch-icon" href="{% static 'logos/logo-.png' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Raleway:wght@600;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css">

    <!-- Libraries CSS -->
    <link rel="stylesheet" href="{% static 'lib/lightbox/css/lightbox.min.css' %}">
    <link rel="stylesheet" href="{% static 'lib/owlcarousel/assets/owl.carousel.min.css' %}">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <!-- Main CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>

<body>

    {% include 'includes/header.html' %}

    {% block content %}
    {% endblock %}

    {% include 'includes/footer.html' %}

    <!-- ========================================================== -->
    <!-- ✅ SCRIPTS - Load jQuery, Owl Carousel, etc. -->
    <!-- ========================================================== -->
    {% include 'includes/scripts.html' %}

    <!-- ========================================================== -->
    <!-- ✅ EXTRA JAVASCRIPT BLOCK - For page-specific scripts -->
    <!-- ========================================================== -->
    {% block extra_js %}
    {% endblock %}

    <!-- ========================================================== -->
    <!-- ✅ SPINNER + MOBILE MENU TOGGLE (Only once!) -->
    <!-- ========================================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            'use strict';

            // Spinner
            const spinner = document.getElementById('spinner');
            if (spinner) {
                setTimeout(function () {
                    spinner.style.display = 'none';
                    spinner.classList.remove('show');
                }, 800);
            }

            // Mobile menu toggle
            const toggleBtn = document.getElementById('trMobileToggle');
            const mobileMenu = document.getElementById('trMobileMenu');
            if (toggleBtn && mobileMenu) {
                toggleBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    mobileMenu.classList.toggle('open');
                });
            }
        });
    </script>

</body>
</html>
