{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>{% block title %}Tahir Rafique Clothes House{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ========================================================== -->
    <!-- ✅ CSP META TAG (Prevents JS Blocking / Infinite Reload) -->
    <!-- ========================================================== -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:;">

    <!-- ========================================================== -->
    <!-- ✅ FAVICON (Browser Tab Icon) - Fixed for better display -->
    <!-- ========================================================== -->
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'logos/logo-.png' %}">
    <link rel="shortcut icon" href="{% static 'logos/logo-.png' %}">
    <link rel="apple-touch-icon" href="{% static 'logos/logo-.png' %}">
    <!-- Fallback for modern browsers -->
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Raleway:wght@600;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css">

    <!-- Libraries CSS -->
    <link rel="stylesheet" href="{% static 'lib/lightbox/css/lightbox.min.css' %}">
    <link rel="stylesheet" href="{% static 'lib/owlcarousel/assets/owl.carousel.min.css' %}">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <!-- Main CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- ========================================================== -->
    <!-- ✅ ADDED: jQuery and Libraries JS (Needed for Owl Carousel) -->
    <!-- ========================================================== -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static 'lib/owlcarousel/owl.carousel.min.js' %}"></script>
    <script src="{% static 'lib/lightbox/js/lightbox.min.js' %}"></script>

</head>

<body>

    {% include 'includes/header.html' %}

    {% block content %}
    {% endblock %}

    {% include 'includes/footer.html' %}

    {% include 'includes/scripts.html' %}

    <!-- ========================================================== -->
    <!-- ✅ HEADER JAVASCRIPT (Spinner + Mobile Menu Toggle) -->
    <!-- ========================================================== -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        'use strict';
        
        // 1. Spinner remove safely
        const spinner = document.getElementById('spinner');
        if (spinner) {
            setTimeout(function() {
                spinner.style.display = 'none';
                spinner.classList.remove('show');
            }, 800); // 0.8 seconds load time
        }

        // 2. Mobile menu toggle (Industry standard)
        const toggleBtn = document.getElementById('trMobileToggle');
        const mobileMenu = document.getElementById('trMobileMenu');
        if (toggleBtn && mobileMenu) {
            toggleBtn.addEventListener('click', function(e) {
                e.preventDefault(); // Stops any accidental page jump
                mobileMenu.classList.toggle('open');
            });
        }
    });
    </script>

</body>

</html>
